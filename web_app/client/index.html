<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mesh3D Solver</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Mesh3D Solver</h1>
        <p>Upload a point cloud, run the server solve, and inspect checkpoint results.</p>
      </div>
      <span id="serverStatus" class="status">Checking server</span>
    </header>

    <main class="layout">
      <section class="panel controls">
        <h2>New Job</h2>
        <form id="jobForm">
          <label>
            Point cloud .msh
            <input id="pointCloud" name="pointCloud" type="file" accept=".msh,.txt" required />
          </label>

          <div class="grid">
            <label>
              Stiffness
              <input id="stiffness" type="number" value="10" min="0" step="0.1" />
            </label>
            <label>
              Damping
              <input id="damping" type="number" value="0.1" min="0" step="0.01" />
            </label>
            <label>
              Snapshot interval
              <input id="snapshotInterval" type="number" value="5" min="1" step="1" />
            </label>
            <label>
              Max sim time
              <input id="maxSimTime" type="number" value="120" min="1" step="1" />
            </label>
            <label>
              Spring seed
              <input id="springSeed" type="number" value="42" min="0" step="1" />
            </label>
            <label>
              Max spring dist
              <input id="maxSpringDist" type="number" value="1.5" min="0.01" step="0.01" />
            </label>
            <label>
              Max springs/pt
              <input id="maxSpringsPerParticle" type="number" value="4" min="1" step="1" />
            </label>
            <label>
              Connect prob
              <input id="springConnectProb" type="number" value="0.8" min="0" max="1" step="0.01" />
            </label>
          </div>

          <button type="submit">Run Solve</button>
        </form>

        <h2>Jobs</h2>
        <div id="jobList" class="job-list"></div>
      </section>

      <section class="panel viewer">
        <div class="viewer-head">
          <div>
            <h2 id="activeJobTitle">No job selected</h2>
            <p id="activeJobMeta">Run a solve to see checkpoints.</p>
          </div>
          <a id="downloadLink" class="download hidden" href="#">Download</a>
        </div>

        <div id="checkpointTabs" class="tabs"></div>
        <pre id="meshPreview" class="mesh-preview">No mesh loaded.</pre>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
